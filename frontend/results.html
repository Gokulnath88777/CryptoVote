}

    border-radius: 12px;

    transition: 0.3s;
    cursor: pointer;
}

.candidate-card:hover {
    transform: translateY(-5px);

}

.candidate-card.selected {
    border-color: #4f46e5;
}

}

/* TEXT */

}

    border-radius: 8px;
    font-weight: 600;

.select-btn:hover {

<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Election Results</h1>
            <p>Live blockchain-verified voting results</p>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="totalVotes">0</div>
                <div class="stat-label">Total Votes</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="candidateCount">0</div>
                <div class="stat-label">Candidates</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="blockCount">0</div>
                <div class="stat-label">Blockchain Blocks</div>
            </div>
        </div>

        <div id="winnerSection"></div>

        <div class="results-card">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 2rem;">
                📊 Vote Distribution
            </h2>
            <div class="chart-container">
                <div class="bar-chart" id="barChart">
                    <div class="no-data">Loading results...</div>
                </div>
            </div>
        </div>

        <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function loadResults() {
            try {
                const response = await fetch(`${API_URL}/get_results`);
                const data = await response.json();

                // Update stats
                document.getElementById('totalVotes').textContent = data.total_votes;
                document.getElementById('candidateCount').textContent = data.results.length;
                document.getElementById('blockCount').textContent = data.blockchain_length;

                // Show winner
                if (data.results.length > 0 && data.results[0].votes > 0) {
                    showWinner(data.results[0]);
                }

                // Display chart
                displayBarChart(data.results, data.total_votes);
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('barChart').innerHTML = 
                    '<div class="no-data">Failed to load results. Please ensure the server is running.</div>';
            }
        }

        function showWinner(winner) {
            const winnerSection = document.getElementById('winnerSection');
            winnerSection.innerHTML = `
                <div class="winner-section">
                    <div class="winner-icon">👑</div>
                    <h2>Current Leader</h2>
                    <div style="font-size: 3rem; margin: 1rem 0;">${winner.image}</div>
                    <h2 style="font-size: 2rem;">${winner.name}</h2>
                    <p>${winner.party}</p>
                    <p style="font-size: 2rem; font-weight: bold; color: #667eea; margin-top: 1rem;">
                        ${winner.votes} votes
                    </p>
                </div>
            `;
        }

        function displayBarChart(results, totalVotes) {
            const chartDiv = document.getElementById('barChart');
            
            if (results.length === 0 || totalVotes === 0) {
                chartDiv.innerHTML = '<div class="no-data">No votes cast yet</div>';
                return;
            }

            chartDiv.innerHTML = '';

            // Find max votes for scaling
            const maxVotes = Math.max(...results.map(r => r.votes));

            results.forEach(candidate => {
                const percentage = totalVotes > 0 ? (candidate.votes / totalVotes * 100).toFixed(1) : 0;
                const height = maxVotes > 0 ? (candidate.votes / maxVotes * 100) : 0;

                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar-wrapper';
                barWrapper.innerHTML = `
                    <div class="bar-container">
                        <div class="bar" style="height: ${height}%">
                            ${candidate.votes}
                        </div>
                    </div>
                    <div class="bar-label">
                        <div class="candidate-icon">${candidate.image}</div>
                        <div class="candidate-name">${candidate.name}</div>
                        <div class="candidate-party">${candidate.party}</div>
                        <div style="color: #667eea; font-weight: bold; margin-top: 0.5rem;">
                            ${percentage}%
                        </div>
                    </div>
                `;
                chartDiv.appendChild(barWrapper);
            });
        }

        function goBack() {
            const role = localStorage.getItem('role');
            if (role === 'admin') {
                window.location.href = 'admin_dashboard.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Load results on page load
        loadResults();

        // Auto-refresh every 5 seconds
        setInterval(loadResults, 5000);
    </script>
